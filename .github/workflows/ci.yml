name: VCDS Wave 1 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react_native_space
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit || true

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0 || true

      - name: Unit tests
        run: npm test -- --watchAll=false --passWithNoTests || true

  backend:
    name: Backend API (Node/Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vcds
          POSTGRES_PASSWORD: vcds_test
          POSTGRES_DB: vcds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit || true

      - name: Run DB schema
        env:
          PGPASSWORD: vcds_test
        run: |
          if [ -f "src/db/schema.sql" ]; then
            psql -h localhost -U vcds -d vcds_test -f src/db/schema.sql
          else
            echo "No schema.sql — skipping"
          fi

      - name: Run API tests
        env:
          DATABASE_URL: postgresql://vcds:vcds_test@localhost:5432/vcds_test
          JWT_SECRET: ci_test_secret
          PAYFAST_MERCHANT_ID: test
          PAYFAST_MERCHANT_KEY: test
          PAYFAST_PASSPHRASE: test
          NODE_ENV: test
        run: npm test -- --passWithNoTests || true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit frontend deps
        run: cd react_native_space && npm audit --audit-level=high || true
      - name: Audit backend deps
        run: cd api && npm audit --audit-level=high || true
