name: Backend CI

on:
  push:
    branches: [main]
    paths: ["api/**"]
  pull_request:
    branches: [main]
    paths: ["api/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vcds_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Run API tests
        run: cd api && npm test --if-present
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vcds_test
          JWT_SECRET: test-secret
          NODE_ENV: test
