name: Deploy to Render (API)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'Dockerfile'

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{{"clearCache": false}}'

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'vcds-ops'
          slack-message: |
            ${{ job.status == 'success' && '✅' || '❌' }} *${{ github.repository }}* API deploy triggered on Render
            Branch: `${{ github.ref_name }}` | Commit: `${{ github.sha }}`
            Actor: ${{ github.actor }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
